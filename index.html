body::before{content:"";position:fixed;inset:0;background:radial-gradient(90% 90% at 40% 45%,rgba(3,8,24,0) 40%,rgba(3,6,18,.55))}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:50% 50%}
canvas{position:absolute;display:block;border-radius:18px}
#scene{left:20px;top:14px;cursor:grab;touch-action:none}#scene.drag{cursor:grabbing}
#graph{left:800px;top:14px;background:rgba(4,9,26,.62);border:1px solid var(--line);backdrop-filter:blur(2px)}
#bar{position:absolute;left:20px;right:20px;top:590px;height:116px;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 18px;
  background:rgba(4,9,26,.62);border:1px solid var(--line);border-radius:18px;font-size:22px}
button{font-family:inherit;color:var(--ink);cursor:pointer;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:12px;min-width:46px;height:42px;padding:0 12px;font-size:20px}
button:hover{border-color:var(--amber)}button.on{background:var(--amber);color:#1b1204;border-color:var(--amber)}
.row{display:flex;align-items:center;gap:14px}
.sep{width:1px;height:34px;background:var(--line)}
.g{display:flex;align-items:center;gap:8px;color:var(--dim)}
.g b{font-family:var(--mono);font-weight:500;color:var(--amber);min-width:56px;font-size:19px}
input[type=range]{accent-color:var(--amber);width:150px}
.dot{display:inline-block;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e9c9a0,#a8714a 60%,#5a3a26)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <canvas id="graph"></canvas>
  <div id="bar">
    <div class="row">
      <button id="play" title="">▶</button><button id="clr" title="">↺</button>
      <div class="sep"></div>
      <button id="p0"><span class="dot" style="width:5px;height:5px"></span></button>
      <button id="p1"><span class="dot" style="width:11px;height:11px"></span></button>
      <button id="p2"><span class="dot" style="width:20px;height:20px"></span></button>
      <div class="g"><span>◯</span><input id="kR" type="range" min="0.005" max="0.15" step="0.001" value="0.1"><b id="kV"></b></div>
      <div class="sep"></div>
      <div class="g"><span>∠</span><input id="iR" type="range" min="0" max="90" step="0.1" value="90" style="width:260px"><b id="iV" style="min-width:64px"></b></div>
    </div>
    <div class="row">
      <div class="g"><span>⏱</span><input id="sR" type="range" min="0.1" max="2" step="0.05" value="0.6"><b id="sV"></b></div>
      <div class="sep"></div>
      <div class="g"><span>↻</span><input id="rR" type="range" min="0" max="12" step="0.5" value="3"><b id="rV"></b></div>
      <div class="sep"></div>
      <div class="g"><span>≈</span><input id="nR" type="range" min="0" max="0.3" step="0.005" value="0"><b id="nV"></b></div>
      <div class="sep"></div>
      <button id="zm">⇕ <span id="zV"></span></button>
    </div>
  </div>
</div>

function start(starImg,planetImg){
  // ---------- 별 자전: 사진의 구면을 세로축으로 돌려서 다시 그린다 (표면 무늬가 왼쪽→오른쪽으로 이동) ----------

  const mk=()=>{const c=document.createElement('canvas');c.width=c.height=PS;return c;};

  const SRC=sxx.getImageData(0,0,PS,PS).data;

  const OUT=stx.createImageData(PS,PS);
  const LL=1.2,EE=0.35;                                                    // 사진에서 무늬가 선명한 경도 범위(±69°)를 이어 붙여 한 바퀴를 만든다
  function renderStar(rot){

    for(let j=0;j<PS;j++){const y=(j+.5-PC)/RP,v=y/RR,sv=1-v*v;
      for(let i=0;i<PS;i++){const x=(i+.5-PC)/RP,q=(j*PS+i)*4,u=x/RR,r2=u*u+v*v;
        if(r2>=1){o[q]=SRC[q];o[q+1]=SRC[q+1];o[q+2]=SRC[q+2];o[q+3]=SRC[q+3];continue;}
        const s=Math.sqrt(sv),lam=Math.asin(Math.max(-1,Math.min(1,u/s))),m=(((lam+rot+LL)%(2*LL))+2*LL)%(2*LL),a=m-LL,d=Math.min(m,2*LL-m);
        const alt=m<EE?a+2*LL:(2*LL-m<EE?a-2*LL:null),wp=alt===null?1:.5+.5*d/EE;   // 이어 붙인 이음새는 두 장면을 섞어 감춤
        const w=Math.min(1,(1-Math.sqrt(r2))/0.08);                          // 가장자리 근처는 원래 사진과 섞음
        for(let c=0;c<4;c++){let t=smp(a,s,j,c);if(alt!==null)t=t*wp+smp(alt,s,j,c)*(1-wp);o[q+c]=t*w+SRC[q+c]*(1-w);}}}
    stx.putImageData(OUT,0,0);
  }
  // ---------- 측광기: 별 사진 위에 행성 실루엣을 겹쳐 놓고 남은 빛의 합을 직접 계산 ----------
  const pc=mk();
  const px=pc.getContext('2d',{willReadFrequently:true});
  function measure(dx,dy,k,withPlanet){
    px.globalCompositeOperation='source-over';px.fillStyle='#000';px.fillRect(0,0,PS,PS);
    px.drawImage(starCv,0,0);
    if(withPlanet){px.fillStyle='#000';px.beginPath();px.arc(PC+dx*RP,PC+dy*RP,k*RP,0,6.2832);px.fill();} // 행성 자체의 빛은 별에 비해 무시할 수 있어 검은 원판으로 계산
    const d=px.getImageData(0,0,PS,PS).data;let s=0;
    for(let i=0;i<d.length;i+=4)s+=d[i]+d[i+1]+d[i+2];
    return s;
  }
  renderStar(0);
  const F0=measure(0,0,0,false);
  let rot=0,spinRPM=3,Fb=F0;                        // Fb: 지금 자전 각도에서 행성이 없을 때 별의 밝기(기준 100%)

  // ---------- 상태 ----------
  let k=0.1,incl=90,ph=0.18,playing=false,dragging=false,sigma=0,zoomLv=0,speed=0.6;
  const ranges=[0.016,0.004,0.001,0.00025];
  let data=new Float32Array(NB+1).fill(NaN),curF=1;
  const cosI=()=>Math.cos(incl*Math.PI/180);
  const phi=p=>2*Math.PI*(p-0.5);
  const geom=p=>{const f=phi(p);return{x:A*Math.sin(f),y:A*cosI()*Math.cos(f),front:Math.cos(f)>0};};
  function fluxAt(p){ // 사진 위에서 직접 측정한 밝기 (0~1 정규화)
    const g=geom(p);if(!g.front)return 1;
    if(Math.hypot(g.x,g.y)>=1+k+0.03)return 1;
    return measure(g.x,g.y,k,true)/Fb;
  }
  const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
  const rec=b=>{data[b]=fluxAt(b/NB)+sigma*gauss();};
  function bump(a,b){ // a→b 사이의 위치에서 측정 (한 프레임에 최대 24회)
    let d=b-a;d-=Math.round(d);const n=Math.min(24,Math.max(1,Math.ceil(Math.abs(d)*NB)));
    for(let i=1;i<=n;i++){const p=((a+d*i/n)%1+1)%1;rec(Math.round(p*NB)%(NB+1));}
  }

  // ---------- 장면 ----------
  function drawScene(){
    const c=sx,g=geom(ph),pr=k*RS,pxs=CX+g.x*RS,pys=CY+g.y*RS,ry=A*cosI()*RS,rx=A*RS;
    c.clearRect(0,0,SW,SH);
    const hide=!g.front&&Math.hypot(g.x,g.y)<1+k;
    const planet=()=>{ // 목성 사진
      const r=Math.max(pr,0.01);c.drawImage(planetImg,pxs-r,pys-r,2*r,2*r);
      if(pr<4.5){c.strokeStyle='rgba(94,234,212,.95)';c.lineWidth=1.6;c.beginPath();c.arc(pxs,pys,9,0,6.2832);c.stroke();}
      if(dragging){c.strokeStyle='rgba(255,180,84,.95)';c.lineWidth=2;c.beginPath();c.arc(pxs,pys,Math.max(pr+5,12),0,6.2832);c.stroke();}};
    c.lineWidth=1.4;c.setLineDash([5,7]);
    c.strokeStyle='rgba(190,205,240,.35)';c.beginPath();c.ellipse(CX,CY,rx,Math.max(ry,.5),0,Math.PI,2*Math.PI);c.stroke();
    if(!g.front&&!hide)planet();
    // 별 사진
    const side=2.5*RS;c.drawImage(starCv,CX-side/2,CY-side/2,side,side);
    c.strokeStyle='rgba(190,205,240,.7)';c.beginPath();c.ellipse(CX,CY,rx,Math.max(ry,.5),0,0,Math.PI);c.stroke();c.setLineDash([]);
    if(g.front)planet();
    sideView(c,g);
    // 측광기 보기 (작은 창)
    const IW=112,ix=SW-IW-14,iy=14;
    c.fillStyle='rgba(2,5,14,.85)';c.fillRect(ix-1,iy-1,IW+2,IW+2);c.drawImage(pc,ix,iy,IW,IW);
    c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=1;c.setLineDash([]);c.strokeRect(ix-.5,iy-.5,IW+1,IW+1);
  }
  // ---------- 옆에서 본 그림: 지구 쪽에서 볼 때 궤도면이 별 앞을 지나는지 확인 ----------
  function sideView(c,g){
    const bw=170,bh=120,bx=8,by=SH-bh-8,R=17,cx=bx+112,cy=by+bh/2,th=incl*Math.PI/180,ux=-Math.sin(th),uy=Math.cos(th);
    c.save();c.setLineDash([]);
    c.fillStyle='rgba(2,5,14,.82)';c.beginPath();c.roundRect(bx,by,bw,bh,12);c.fill();c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=1;c.stroke();
    c.beginPath();c.rect(bx+1,by+1,bw-2,bh-2);c.clip();
    const hit=A*Math.cos(th)<1+k;                      // 궤도가 별 원반 앞을 지나가는가
    c.fillStyle=hit?'rgba(94,234,212,.16)':'rgba(255,128,128,.10)';c.fillRect(bx+22,cy-R,cx-bx-22,2*R);   // 지구에서 별을 향한 시선 띠
    c.strokeStyle=hit?'rgba(94,234,212,.7)':'rgba(255,128,128,.6)';c.setLineDash([4,4]);
    c.beginPath();c.moveTo(bx+22,cy-R);c.lineTo(cx,cy-R);c.moveTo(bx+22,cy+R);c.lineTo(cx,cy+R);c.stroke();c.setLineDash([]);
    // 궤도면(옆에서 본 선)
    c.strokeStyle='rgba(190,205,240,.8)';c.lineWidth=1.6;c.beginPath();c.moveTo(cx-ux*A*R,cy-uy*A*R);c.lineTo(cx+ux*A*R,cy+uy*A*R);c.stroke();
    // 별
    c.drawImage(starCv,cx-R*1.25,cy-R*1.25,R*2.5,R*2.5);
    // 지구
    const eg=c.createRadialGradient(bx+12,cy-3,1,bx+14,cy,8);eg.addColorStop(0,'#9be0ff');eg.addColorStop(1,'#2a6fd6');c.fillStyle=eg;c.beginPath();c.arc(bx+14,cy,7,0,6.2832);c.fill();
    // 행성 (지금 위치)
    const d=A*Math.cos(phi(ph)),pr=Math.max(k*R,3.2);
    c.drawImage(planetImg,cx+ux*d*R-pr,cy+uy*d*R-pr,2*pr,2*pr);
    // 판정 표시
    c.font='700 24px '+FF;c.textAlign='right';c.fillStyle=hit?'#5eead4':'#ff8080';c.fillText(hit?'✓':'✕',bx+bw-10,by+28);
    c.restore();
  }
  // ---------- 그래프 ----------
  function drawGraph(){
    const c=gx,L=82,R=GW-18,T=70,B=GH-70,w=R-L,h=B-T,range=ranges[zoomLv],fTop=1+Math.max(range*.06,4.2*sigma),fBot=1-range;
    const Y=f=>T+(fTop-f)/(fTop-fBot)*h,X=p=>L+p*w;
    c.clearRect(0,0,GW,GH);
    const dec=range>=.004?2:range>=.001?3:4;
    // 격자
    for(let i=0;i<=16;i++){const f=1-range*i/8+range*0; }
    c.font='14px '+FF;
    const nMaj=8;
    for(let i=0;i<=nMaj;i++){const f=1-range*i/nMaj,y=Y(f);
      c.strokeStyle='rgba(255,255,255,.17)';c.lineWidth=1;c.beginPath();c.moveTo(L,y);c.lineTo(R,y);c.stroke();
      c.fillStyle='rgba(205,218,248,.95)';c.textAlign='right';c.fillText((f*100).toFixed(dec),L-14,y+5);
      c.strokeStyle='rgba(255,255,255,.5)';c.beginPath();c.moveTo(L-8,y);c.lineTo(L,y);c.stroke();
      if(i<nMaj){const ym=Y(1-range*(i+.5)/nMaj);c.strokeStyle='rgba(255,255,255,.07)';c.beginPath();c.moveTo(L,ym);c.lineTo(R,ym);c.stroke();
        c.strokeStyle='rgba(255,255,255,.3)';c.beginPath();c.moveTo(L-4,ym);c.lineTo(L,ym);c.stroke();}}
    for(let i=0;i<=20;i++){const x=X(i/20);c.strokeStyle=i%5===0?'rgba(255,255,255,.17)':'rgba(255,255,255,.06)';c.beginPath();c.moveTo(x,T);c.lineTo(x,B);c.stroke();}
    c.fillStyle='rgba(205,218,248,.95)';c.textAlign='center';
    ['0','0.25','0.5','0.75','1'].forEach((s,i)=>c.fillText(s,X(i/4),B+22));
    c.textAlign='left';c.fillStyle='rgba(205,218,248,.8)';c.fillText('%',L-34,T-14);
    c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=1.4;c.strokeRect(L,T,w,h);
    // 기준선 100%
    c.setLineDash([6,5]);c.strokeStyle='rgba(255,180,84,.55)';c.beginPath();c.moveTo(L,Y(1));c.lineTo(R,Y(1));c.stroke();c.setLineDash([]);
    // 측정점 + 연결선
    c.save();c.beginPath();c.rect(L,T,w,h);c.clip();
    c.strokeStyle='rgba(94,234,212,.55)';c.lineWidth=1.6;c.beginPath();let pen=false,last=-9;
    if(sigma===0)for(let i=0;i<=NB;i++){const v=data[i];if(Number.isNaN(v)){pen=false;continue;}const x=X(i/NB),y=Y(v);if(pen&&i-last<=3)c.lineTo(x,y);else c.moveTo(x,y);pen=true;last=i;}c.stroke();
    c.fillStyle='#5eead4';
    for(let i=0;i<=NB;i++){const v=data[i];if(Number.isNaN(v))continue;c.beginPath();c.arc(X(i/NB),Y(v),2.3,0,6.2832);c.fill();}
    c.restore();
    // 커서
    const x=X(ph),y=Y(Math.min(fTop,Math.max(fBot,curF)));
    c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;c.beginPath();c.moveTo(x,T);c.lineTo(x,B);c.stroke();
    c.fillStyle='#fff';c.beginPath();c.arc(x,y,6.5,0,6.2832);c.fill();c.strokeStyle='#ffb454';c.lineWidth=2.5;c.stroke();
    // 수치 표시
    c.textAlign='left';c.fillStyle='#ffb454';c.font='500 34px '+getComputedStyle(document.body).getPropertyValue('--mono');
    c.fillText((curF*100).toFixed(4),L,40);
    const ppm=Math.round((1-curF)*1e6);c.font='500 17px '+FF;c.fillStyle='rgba(205,218,248,.9)';c.textAlign='right';
    c.fillText('−'+ppm.toLocaleString('en-US')+' ppm',R,38);
  }
  // ---------- 입력 ----------
  function phaseFromPointer(e){
    const r=sc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*SW,y=(e.clientY-r.top)/r.height*SH;
    const X=(x-CX)/RS,Y=(y-CY)/RS,ysc=Math.max(cosI(),.1)*A,f=Math.atan2(X/A,Y/ysc);
    return((f/(2*Math.PI)+.5)%1+1)%1;}
  sc.addEventListener('pointerdown',e=>{dragging=true;playing=false;setPlay();sc.classList.add('drag');sc.setPointerCapture(e.pointerId);const n=phaseFromPointer(e);rec(Math.round(n*NB)%(NB+1));ph=n;});
  sc.addEventListener('pointermove',e=>{if(!dragging)return;const n=phaseFromPointer(e);bump(ph,n);ph=n;});
  const end=()=>{dragging=false;sc.classList.remove('drag');};sc.addEventListener('pointerup',end);sc.addEventListener('pointercancel',end);
  addEventListener('keydown',e=>{
    if(e.target&&e.target.tagName==='INPUT')return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const n=((ph+(e.key==='ArrowRight'?1:-1)*.004)%1+1)%1;bump(ph,n);ph=n;}
    else if(e.key===' '){e.preventDefault();playing=!playing;setPlay();}});
  function setPlay(){$('#play').textContent=playing?'⏸':'▶';$('#play').classList.toggle('on',playing);}
  $('#play').onclick=()=>{playing=!playing;setPlay();};
  $('#clr').onclick=()=>{data.fill(NaN);};
  const setK=v=>{k=v;$('#kR').value=v;$('#kV').textContent=v.toFixed(3);data.fill(NaN);};
  $('#kR').addEventListener('input',e=>setK(+e.target.value));
  $('#p0').onclick=()=>setK(.009);$('#p1').onclick=()=>setK(.035);$('#p2').onclick=()=>setK(.1);
  $('#iR').addEventListener('input',e=>{incl=+e.target.value;$('#iV').textContent=incl.toFixed(1)+'°';data.fill(NaN);});
  $('#sR').addEventListener('input',e=>{speed=+e.target.value;$('#sV').textContent='×'+speed.toFixed(2);});
  $('#rR').addEventListener('input',e=>{spinRPM=+e.target.value;$('#rV').textContent=spinRPM?spinRPM.toFixed(1)+'/분':'0';});
  $('#nR').addEventListener('input',e=>{sigma=(+e.target.value)/100;$('#nV').textContent=(+e.target.value).toFixed(3)+'%';data.fill(NaN);});
  $('#zm').onclick=()=>{zoomLv=(zoomLv+1)%ranges.length;$('#zV').textContent=(ranges[zoomLv]*100)+'%';};
  $('#sV').textContent='×0.60';$('#rV').textContent='3.0/분';$('#kV').textContent=k.toFixed(3);$('#iV').textContent=incl.toFixed(1)+'°';$('#nV').textContent='0.000%';$('#zV').textContent=(ranges[zoomLv]*100)+'%';setPlay();

  let last=performance.now();
  function loop(now){
    const dt=Math.min(.1,(now-last)/1000);last=now;
    try{
      if(spinRPM>0){rot=(rot+dt*spinRPM/60*2*Math.PI)%(2*Math.PI);renderStar(rot);Fb=measure(0,0,0,false);}
      if(playing){const n=(ph+dt*speed/9)%1;bump(ph,n);ph=n;}
      const g=geom(ph);
      curF=g.front?measure(g.x,g.y,k,true)/Fb:1;   // 지금 위치에서 측정한 값 (측광기 창에도 표시됨)
      drawScene();drawGraph();
    }catch(err){console.error(err);}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__test={get rot(){return rot},get Fb(){return Fb},set spin(v){spinRPM=v},setI(v){incl=v;data.fill(NaN)},get ph(){return ph},set ph(v){ph=v},measure,F0,fluxAt,setK,get data(){return data}};
}
})();
</script>
</body>
